services:
  assay:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - assay-data:/data
    environment:
      - ASSAY_ADMIN_EMAIL=${ASSAY_ADMIN_EMAIL}
      - ASSAY_ADMIN_PASSWORD_HASH=${ASSAY_ADMIN_PASSWORD_HASH}
      # The app reads WARDEN_SECRET (vendored warden), not ASSAY_JWT_SECRET.
      - WARDEN_SECRET=${WARDEN_SECRET}
    expose:
      - "8000"
    healthcheck:
      # python is in the app image (no curl); hit the same /health nginx proxies.
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - assay

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  assay-data:
  certbot-www:
  certbot-certs:
